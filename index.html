<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merge-Quick Hybrid Sorter</title>
<style>
  /* ── Reset & tokens ──────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --bg:       #0d0f14;
    --panel:    #13161f;
    --border:   #1e2333;
    --text:     #c9cfe0;
    --muted:    #5a6282;
    --accent1:  #4f8cff;   /* merge  */
    --accent2:  #ff5f7e;   /* quick  */
    --accent3:  #34d4a0;   /* hybrid */
    --swap:     #ffcc00;
    --compare:  #ff8c00;
    --done:     #3de0b0;
    --radius:   10px;
    --font:     'JetBrains Mono', 'Fira Code', monospace;
  }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
    gap: 22px;
  }
 
  /* ── Header ──────────────────────────────────────────────────── */
  header { text-align: center; }
  header h1 {
    font-size: clamp(1.2rem, 3vw, 1.75rem);
    letter-spacing: .06em;
    background: linear-gradient(90deg, var(--accent1), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: var(--muted); font-size: .78rem; margin-top: 4px; }
 
  /* ── Card ────────────────────────────────────────────────────── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    width: 100%;
    max-width: 900px;
  }
 
  /* ── Controls ────────────────────────────────────────────────── */
  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }
  @media (max-width: 600px) {
    .controls-grid { grid-template-columns: 1fr 1fr; }
    .controls-grid .btn-row { grid-column: 1 / -1; }
  }
 
  label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 5px; letter-spacing: .05em; text-transform: uppercase; }
 
  input[type="text"], input[type="number"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: .85rem;
    padding: 8px 11px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--accent1); }
 
  .row { display: flex; gap: 10px; }
 
  button {
    font-family: var(--font);
    font-size: .8rem;
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: not-allowed; }
 
  .btn-primary  { background: var(--accent1);  color: #fff; }
  .btn-danger   { background: #2a1520; color: var(--accent2); border: 1px solid var(--accent2); }
  .btn-neutral  { background: #1a1e2b; color: var(--text); border: 1px solid var(--border); }
 
  /* algorithm radio pills */
  .algo-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .algo-pill { position: relative; }
  .algo-pill input { position: absolute; opacity: 0; width: 0; }
  .algo-pill label {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: .78rem;
    cursor: pointer;
    transition: all .2s;
    text-transform: none;
    letter-spacing: .03em;
    color: var(--muted);
    margin: 0;
  }
  .algo-pill input:checked + label { border-color: transparent; color: #fff; font-weight: 600; }
  #algoMerge:checked  + label { background: var(--accent1); }
  #algoQuick:checked  + label { background: var(--accent2); }
  #algoHybrid:checked + label { background: var(--accent3); color: #0d0f14; }
 
  /* threshold row */
  .threshold-row {
    display: flex; align-items: center; gap: 10px;
    transition: opacity .3s;
  }
  .threshold-row input[type=range] {
    flex: 1; accent-color: var(--accent3);
    padding: 0; background: none; border: none;
  }
  .threshold-val {
    min-width: 26px; text-align: right;
    font-size: .9rem; color: var(--accent3);
  }
 
  /* speed slider */
  .speed-row { display: flex; align-items: center; gap: 10px; }
  .speed-row input[type=range] { flex: 1; accent-color: var(--accent1); padding: 0; background: none; border: none; }
  .speed-val { min-width: 48px; font-size: .8rem; color: var(--accent1); }
 
  /* ── Divider ─────────────────────────────────────────────────── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
 
  /* ── Visualiser ──────────────────────────────────────────────── */
  #vizCard { overflow: hidden; }
 
  #viz-container {
    position: relative;
    width: 100%;
    height: 220px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    padding-top: 10px;
  }
 
  .bar {
    flex: 1;
    border-radius: 3px 3px 0 0;
    transition: height .06s ease, background-color .06s;
    background: var(--accent1);
    position: relative;
    min-width: 4px;
  }
  .bar.swap    { background: var(--swap)    !important; }
  .bar.compare { background: var(--compare) !important; }
  .bar.done    { background: var(--done)    !important; }
 
  /* val labels under bars — only shown when ≤20 elements */
  .bar-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
  }
 
  /* ── Stats row ───────────────────────────────────────────────── */
  .stats {
    display: flex; gap: 18px; flex-wrap: wrap;
    margin-top: 8px;
  }
  .stat { display: flex; flex-direction: column; }
  .stat-label { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .stat-val   { font-size: 1.1rem; color: var(--text); }
  .stat-val.highlight { color: var(--accent3); }
 
  /* ── Output / sorted array ───────────────────────────────────── */
  #sortedOutput {
    font-size: .8rem;
    color: var(--accent3);
    word-break: break-all;
    min-height: 20px;
    letter-spacing: .03em;
  }
 
  /* ── Playback bar ────────────────────────────────────────────── */
  .playback {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .step-counter { font-size: .78rem; color: var(--muted); }
 
  /* ── Progress bar ────────────────────────────────────────────── */
  .progress-track {
    flex: 1; height: 4px; background: var(--border);
    border-radius: 4px; overflow: hidden; min-width: 80px;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent1), var(--accent3));
    border-radius: 4px;
    transition: width .1s;
    width: 0%;
  }
 
  /* ── Toast ───────────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e2333; border: 1px solid var(--border);
    color: var(--text); font-size: .8rem;
    padding: 9px 20px; border-radius: 24px;
    pointer-events: none; opacity: 0;
    transition: opacity .3s;
    white-space: nowrap;
    z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
 
<header>
  <h1>⬡ MERGE-QUICK HYBRID SORTER</h1>
  <p>C++ algorithms &nbsp;·&nbsp; WebAssembly-ready &nbsp;·&nbsp; Step-by-step animation</p>
</header>
 
<!-- ── Input card ─────────────────────────────────────── -->
<div class="card">
  <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <label>Numbers (comma or space separated)</label>
      <input type="text" id="inputNums"
             placeholder="e.g. 42 17 85 3 66 29 51 8 73 14"
             spellcheck="false" />
    </div>
    <div>
      <label>&nbsp;</label>
      <div class="row">
        <button class="btn-neutral" id="btnRandom" title="Fill with random numbers">🎲 Random</button>
        <button class="btn-danger"  id="btnClear"  title="Clear input">✕ Clear</button>
      </div>
    </div>
  </div>
</div>
 
<!-- ── Algorithm + controls card ──────────────────────── -->
<div class="card">
  <div style="display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;flex-wrap:wrap">
 
    <!-- left col: algorithm selector -->
    <div>
      <label>Algorithm</label>
      <div class="algo-pills">
        <div class="algo-pill">
          <input type="radio" name="algo" id="algoMerge" value="merge" checked />
          <label for="algoMerge">Merge Sort</label>
        </div>
        <div class="algo-pill">
          <input type="radio" name="algo" id="algoQuick" value="quick" />
          <label for="algoQuick">Quick Sort</label>
        </div>
        <div class="algo-pill">
          <input type="radio" name="algo" id="algoHybrid" value="hybrid" />
          <label for="algoHybrid">Hybrid Sort</label>
        </div>
      </div>
    </div>
 
    <!-- right col: threshold + speed -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="threshold-row" id="thresholdRow">
        <label style="white-space:nowrap;margin:0">Threshold</label>
        <input type="range" id="thresholdRange" min="2" max="20" value="10" />
        <span class="threshold-val" id="thresholdVal">10</span>
      </div>
      <div class="speed-row">
        <label style="white-space:nowrap;margin:0">Speed</label>
        <input type="range" id="speedRange" min="10" max="600" value="120" />
        <span class="speed-val" id="speedVal">120 ms</span>
      </div>
    </div>
 
  </div>
 
  <hr class="divider" />
 
  <!-- playback controls -->
  <div class="playback">
    <button class="btn-primary"  id="btnSort"  >▶ Sort</button>
    <button class="btn-neutral"  id="btnPause" disabled>⏸ Pause</button>
    <button class="btn-neutral"  id="btnStep"  disabled>⏭ Step</button>
    <button class="btn-neutral"  id="btnReset" disabled>↺ Reset</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="step-counter" id="stepCounter">—</span>
  </div>
</div>
 
<!-- ── Visualiser card ─────────────────────────────────── -->
<div class="card" id="vizCard">
  <div id="viz-container"></div>
 
  <hr class="divider" />
 
  <div class="stats">
    <div class="stat">
      <span class="stat-label">Step</span>
      <span class="stat-val" id="statStep">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Comparisons</span>
      <span class="stat-val highlight" id="statCmp">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Swaps / Moves</span>
      <span class="stat-val highlight" id="statSwap">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Total Steps</span>
      <span class="stat-val" id="statTotal">—</span>
    </div>
  </div>
 
  <hr class="divider" />
 
  <label>Sorted Array</label>
  <div id="sortedOutput">—</div>
</div>
 
<div id="toast"></div>
 
<!-- ── sorter.js (JS bridge / WASM shim) ───────────────── -->
<script>
/* ─── Sorter (JS port of sorter.cpp) ─────────────────────────────────────── */
const Sorter = (() => {
  let _steps = [], _cmp = 0, _sw = 0;
  const reset = () => { _steps = []; _cmp = 0; _sw = 0; };
  const push  = (arr, i, j, isSwap) =>
    _steps.push({ arr: arr.slice(), i, j, isSwap, comparisons: _cmp, swaps: _sw });
 
  /* merge */
  function merge(arr, l, m, r) {
    const L = arr.slice(l, m + 1), R = arr.slice(m + 1, r + 1);
    let i = 0, j = 0, k = l;
    while (i < L.length && j < R.length) {
      ++_cmp;
      arr[k++] = L[i] <= R[j] ? L[i++] : (++_sw, R[j++]);
      push(arr, k - 1, -1, false);
    }
    while (i < L.length) { arr[k++] = L[i++]; push(arr, k-1, -1, false); }
    while (j < R.length) { arr[k++] = R[j++]; push(arr, k-1, -1, false); }
  }
  function mergeRec(arr, l, r) {
    if (l >= r) return;
    const m = l + ((r - l) >> 1);
    mergeRec(arr, l, m); mergeRec(arr, m + 1, r); merge(arr, l, m, r);
  }
 
  /* quick */
  function partition(arr, lo, hi) {
    const pv = arr[hi]; let i = lo - 1;
    for (let j = lo; j < hi; j++) {
      ++_cmp;
      if (arr[j] <= pv) { ++i; [arr[i],arr[j]]=[arr[j],arr[i]]; ++_sw; push(arr,i,j,true); }
      else push(arr, i+1, j, false);
    }
    [arr[i+1],arr[hi]]=[arr[hi],arr[i+1]]; ++_sw; push(arr,i+1,hi,true); return i+1;
  }
  function quickRec(arr, lo, hi) {
    if (lo >= hi) return;
    const p = partition(arr, lo, hi); quickRec(arr, lo, p-1); quickRec(arr, p+1, hi);
  }
 
  /* insertion */
  function insertionSort(arr, lo, hi) {
    for (let i = lo + 1; i <= hi; i++) {
      const key = arr[i]; let j = i - 1;
      while (j >= lo && (++_cmp, arr[j] > key)) {
        arr[j+1] = arr[j--]; ++_sw; push(arr, j+1, i, true);
      }
      arr[j+1] = key; push(arr, j+1, -1, false);
    }
  }
 
  /* hybrid */
  function hybridRec(arr, lo, hi, t) {
    if (lo >= hi) return;
    if (hi - lo + 1 <= t) { insertionSort(arr, lo, hi); return; }
    const m = lo + ((hi - lo) >> 1);
    hybridRec(arr, lo, m, t); hybridRec(arr, m+1, hi, t); merge(arr, lo, m, hi);
  }
 
  const result = () => ({ steps: _steps, totalComparisons: _cmp, totalSwaps: _sw });
 
  return {
    mergeSort(arr)          { reset(); const a=arr.slice(); mergeRec(a,0,a.length-1); return result(); },
    quickSort(arr)          { reset(); const a=arr.slice(); quickRec(a,0,a.length-1); return result(); },
    hybridSort(arr,t=10)    { reset(); const a=arr.slice(); hybridRec(a,0,a.length-1,t); return result(); },
  };
})();
 
/* ─── UI ────────────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
 
let steps        = [];
let currentStep  = -1;
let playing      = false;
let rafTimer     = null;
let originalArr  = [];
let lastTime     = 0;
const ACCENT_MAP = { merge: '#4f8cff', quick: '#ff5f7e', hybrid: '#34d4a0' };
 
/* ── helpers ─────────────────────────────────────────────────────────────── */
function parseInput() {
  const raw = $('inputNums').value.trim();
  if (!raw) return null;
  const nums = raw.split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && isFinite(n));
  if (!nums.length) return null;
  if (nums.length > 120) { toast('Max 120 numbers for smooth animation'); return null; }
  return nums;
}
 
function getAlgo()      { return document.querySelector('input[name="algo"]:checked').value; }
function getThreshold() { return parseInt($('thresholdRange').value); }
function getSpeed()     { return parseInt($('speedRange').value); }
function getAccent()    { return ACCENT_MAP[getAlgo()]; }
 
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
 
/* ── threshold / speed UI ─────────────────────────────────────────────────── */
$('thresholdRange').addEventListener('input', e => { $('thresholdVal').textContent = e.target.value; });
$('speedRange').addEventListener('input', e => { $('speedVal').textContent = e.target.value + ' ms'; });
 
document.querySelectorAll('input[name="algo"]').forEach(r =>
  r.addEventListener('change', () => {
    $('thresholdRow').style.opacity = (r.value === 'hybrid') ? '1' : '0.3';
  })
);
$('thresholdRow').style.opacity = '0.3'; // merge selected by default
 
/* ── random fill ──────────────────────────────────────────────────────────── */
$('btnRandom').addEventListener('click', () => {
  const count = Math.floor(Math.random() * 16) + 10;
  const arr   = Array.from({length: count}, () => Math.floor(Math.random() * 99) + 1);
  $('inputNums').value = arr.join(' ');
});
 
$('btnClear').addEventListener('click', () => { $('inputNums').value = ''; resetViz(); });
 
/* ── build bars ───────────────────────────────────────────────────────────── */
function buildBars(arr, activeI = -1, activeJ = -1, isSwap = false, done = false) {
  const container = $('viz-container');
  const maxVal    = Math.max(...arr, 1);
  const showLabel = arr.length <= 24;
  const accent    = done ? '#3de0b0' : getAccent();
 
  // reuse existing bars if same count
  const existing = container.querySelectorAll('.bar');
  let bars;
  if (existing.length === arr.length) {
    bars = existing;
  } else {
    container.innerHTML = '';
    bars = arr.map(() => { const b = document.createElement('div'); b.className = 'bar'; container.appendChild(b); return b; });
  }
 
  bars.forEach((bar, idx) => {
    const pct    = ((arr[idx] / maxVal) * 90 + 8);
    bar.style.height = pct + '%';
    bar.className     = 'bar';
    bar.style.background = accent;
 
    if (!done) {
      if      (isSwap  && (idx === activeI || idx === activeJ)) bar.classList.add('swap');
      else if (!isSwap && (idx === activeI || idx === activeJ)) bar.classList.add('compare');
    } else {
      bar.style.background = 'var(--done)';
    }
 
    // label
    if (showLabel) {
      let lbl = bar.querySelector('.bar-label');
      if (!lbl) { lbl = document.createElement('span'); lbl.className = 'bar-label'; bar.appendChild(lbl); }
      lbl.textContent = arr[idx];
    }
  });
}
 
/* ── update stats ─────────────────────────────────────────────────────────── */
function updateStats(step, idx, total) {
  $('statStep').textContent  = idx + 1;
  $('statCmp').textContent   = step.comparisons;
  $('statSwap').textContent  = step.swaps;
  $('statTotal').textContent = total;
  $('stepCounter').textContent = `Step ${idx + 1} / ${total}`;
  $('progressFill').style.width = ((idx + 1) / total * 100).toFixed(1) + '%';
}
 
function showFinal(totalCmp, totalSw, sortedArr) {
  $('statCmp').textContent   = totalCmp;
  $('statSwap').textContent  = totalSw;
  $('statTotal').textContent = steps.length;
  $('statStep').textContent  = steps.length;
  $('progressFill').style.width = '100%';
  $('sortedOutput').textContent = sortedArr.join(' → ');
  $('stepCounter').textContent  = `Done — ${steps.length} steps`;
}
 
/* ── reset ────────────────────────────────────────────────────────────────── */
function resetViz() {
  cancelAnimationFrame(rafTimer);
  playing     = false;
  steps       = [];
  currentStep = -1;
  $('progressFill').style.width = '0%';
  $('stepCounter').textContent  = '—';
  $('statStep').textContent     = '—';
  $('statCmp').textContent      = '—';
  $('statSwap').textContent     = '—';
  $('statTotal').textContent    = '—';
  $('sortedOutput').textContent = '—';
  $('viz-container').innerHTML  = '';
  setBtns(false);
  if (originalArr.length) buildBars(originalArr);
}
 
function setBtns(running) {
  $('btnSort').disabled  = running;
  $('btnPause').disabled = !running;
  $('btnStep').disabled  = running || steps.length === 0;
  $('btnReset').disabled = steps.length === 0;
}
 
/* ── main sort kick-off ───────────────────────────────────────────────────── */
$('btnSort').addEventListener('click', () => {
  const arr = parseInput();
  if (!arr) { toast('Enter some numbers first!'); return; }
  originalArr = arr.slice();
 
  const algo   = getAlgo();
  const thresh = getThreshold();
  let result;
  if      (algo === 'merge')  result = Sorter.mergeSort(arr);
  else if (algo === 'quick')  result = Sorter.quickSort(arr);
  else                        result = Sorter.hybridSort(arr, thresh);
 
  steps       = result.steps;
  currentStep = -1;
 
  if (!steps.length) {
    buildBars(arr, -1, -1, false, true);
    showFinal(result.totalComparisons, result.totalSwaps, arr);
    toast('Array already sorted!');
    $('btnReset').disabled = false;
    return;
  }
 
  setBtns(true);
  buildBars(originalArr);
  $('sortedOutput').textContent = '—';
  playing  = true;
  lastTime = performance.now();
  rafTimer = requestAnimationFrame(animLoop);
});
 
/* ── animation loop ────────────────────────────────────────────────────────── */
function animLoop(now) {
  if (!playing) return;
  const delay = getSpeed();
  if (now - lastTime >= delay) {
    lastTime = now;
    advanceStep();
  }
  if (playing) rafTimer = requestAnimationFrame(animLoop);
}
 
function advanceStep() {
  currentStep++;
  if (currentStep >= steps.length) {
    finishSort(); return;
  }
  const s = steps[currentStep];
  buildBars(s.arr, s.i, s.j, s.isSwap, false);
  updateStats(s, currentStep, steps.length);
}
 
function finishSort() {
  playing = false;
  cancelAnimationFrame(rafTimer);
  const last = steps[steps.length - 1];
  buildBars(last.arr, -1, -1, false, true);
  showFinal(last.comparisons, last.swaps, last.arr);
  setBtns(false);
  $('btnSort').disabled  = false;
  $('btnReset').disabled = false;
  $('btnStep').disabled  = true;
}
 
/* ── pause / step / reset ─────────────────────────────────────────────────── */
$('btnPause').addEventListener('click', () => {
  if (playing) {
    playing = false;
    cancelAnimationFrame(rafTimer);
    $('btnPause').textContent  = '▶ Resume';
    $('btnStep').disabled = false;
  } else {
    playing  = true;
    $('btnPause').textContent  = '⏸ Pause';
    $('btnStep').disabled = true;
    lastTime = performance.now();
    rafTimer = requestAnimationFrame(animLoop);
  }
});
 
$('btnStep').addEventListener('click', () => {
  if (steps.length && currentStep < steps.length - 1) {
    advanceStep();
  } else if (currentStep >= steps.length - 1 && steps.length) {
    finishSort();
  }
});
 
$('btnReset').addEventListener('click', resetViz);
 
/* ── init ─────────────────────────────────────────────────────────────────── */
$('inputNums').value = '64 34 25 12 22 11 90';
buildBars([64, 34, 25, 12, 22, 11, 90]);
originalArr = [64, 34, 25, 12, 22, 11, 90];
</script>
</body>
</html>
